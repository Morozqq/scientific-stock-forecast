[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-stock-forecast"
version = "1.0.0"
description = "Educational stock-price forecasting workflow with reproducible tests and CI"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "yfinance>=0.2.40",
  "scikit-learn>=1.3",
  "matplotlib>=3.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
